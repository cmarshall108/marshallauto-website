<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Login{% endblock %} | Marshall Auto LLC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset_url('css/main.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold"><span class="brand-primary">MARSHALL</span> <span class="brand-secondary">AUTO</span></h3>
            <p class="text-muted mb-0">Admin Panel</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
